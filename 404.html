<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Prince Bhatt</title>
    <meta
      name="robots"
      content="noindex" />
    <link
      href="/Portfolio/assets/img/favicon.png"
      rel="icon"
      type="image/png" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;700&display=swap"
      rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #040b14;
        color: #fff;
        font-family: 'Open Sans', system-ui, sans-serif;
        text-align: center;
      }
      .code {
        font-family: 'Raleway', sans-serif;
        font-size: clamp(72px, 18vw, 140px);
        font-weight: 700;
        line-height: 1;
        color: #149ddd;
        letter-spacing: -0.03em;
      }
      h1 {
        font-family: 'Raleway', sans-serif;
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 600;
        margin: 14px 0 10px;
      }
      p {
        color: #a8a9b4;
        max-width: 46ch;
        margin: 0 auto 28px;
        line-height: 1.7;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      a.btn {
        display: inline-block;
        padding: 11px 22px;
        border-radius: 50px;
        text-decoration: none;
        font-size: 15px;
        transition: background-color 0.3s, color 0.3s;
      }
      a.primary {
        background: #149ddd;
        color: #fff;
      }
      a.primary:hover {
        background: #37b3ed;
      }
      a.ghost {
        border: 1px solid #2c3a4d;
        color: #a8a9b4;
      }
      a.ghost:hover {
        border-color: #149ddd;
        color: #fff;
      }
      a:focus-visible {
        outline: 2px solid #149ddd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>That page doesn't exist</h1>
      <p>
        The link may be out of date, or the page has moved. Everything is
        reachable from the home page.
      </p>
      <div class="links">
        <a
          class="btn primary"
          href="/Portfolio/"
          >Back to the portfolio</a
        >
        <a
          class="btn ghost"
          href="https://github.com/princebhatt03"
          >GitHub</a
        >
        <a
          class="btn ghost"
          href="mailto:princebhatt316@gmail.com"
          >Email me</a
        >
      </div>
    </main>
  </body>
</html>
